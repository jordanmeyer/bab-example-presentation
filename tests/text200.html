<!doctype html><html lang="en"><head><meta charset="utf-8"><title>200% text presentation QA</title><style>body{margin:0}iframe{width:1280px;height:1100px;border:0;display:block}pre{white-space:pre-wrap}</style></head><body><iframe title="1280px presentation with 200% text"></iframe><button id="measure">Capture layout metrics</button><pre id="qa">Loading…</pre><script>
const frame=document.querySelector('iframe');frame.src=location.pathname.includes('/tests/')?'/app/':'./index.html';
frame.addEventListener('load',()=>{frame.contentDocument.documentElement.style.fontSize='200%';});
document.querySelector('#measure').onclick=()=>{const w=frame.contentWindow,d=frame.contentDocument;document.querySelector('#qa').textContent=JSON.stringify({width:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,rootFont:w.getComputedStyle(d.documentElement).fontSize,deckFont:w.getComputedStyle(d.querySelector('#deck')).fontSize,height:d.documentElement.scrollHeight,reading:d.body.classList.contains('reading'),slides:[...d.querySelectorAll('.slides>section')].map(s=>({title:s.dataset.title,visible:!!s.getClientRects().length,inert:s.inert,hidden:s.hidden,overflowY:w.getComputedStyle(s).overflowY,clientHeight:s.clientHeight,scrollHeight:s.scrollHeight})),charts:[...d.querySelectorAll('.chart svg')].map(s=>({viewBox:s.getAttribute('viewBox'),width:s.getBoundingClientRect().width,font:w.getComputedStyle(s.querySelector('text')).fontSize})),controls:[...d.querySelectorAll('button,input,summary,a,select')].filter(e=>e.getClientRects().length).map(e=>({text:e.textContent||e.id,width:e.getBoundingClientRect().width,height:e.getBoundingClientRect().height}))},null,2);};
</script></body></html>
